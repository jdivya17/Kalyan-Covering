<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Kalyan Covering</title>
    <meta name="description" content="The page you are looking for does not exist.">
    <link rel="icon" type="image/png" href="assets/kalyan_logo.png">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background-color: var(--black);
            color: var(--white);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            font-family: var(--font-sans);
        }
        .error-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .error-code {
            font-size: 8rem;
            font-family: var(--font-serif);
            color: var(--gold);
            margin: 0;
            line-height: 1;
            text-shadow: 0 0 40px rgba(212, 175, 55, 0.4);
        }
        .error-title {
            font-size: 2rem;
            margin-top: 1rem;
            margin-bottom: 1.5rem;
            color: var(--white);
        }
        .error-message {
            color: var(--white-dim);
            max-width: 500px;
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="nav-inner">
            <a href="index.html" class="nav-logo" aria-label="Kalyan Covering Home">
                <div class="nav-logo-img-wrap"><img src="assets/kalyan_logo.png" alt="Kalyan Logo" class="nav-logo-img"></div>
                Kalyan Covering
            </a>
        </div>
    </nav>

    <div class="error-container">
        <h1 class="error-code">404</h1>
        <h2 class="error-title">Page Not Found</h2>
        <p class="error-message">The jewellery piece or page you are looking for seems to have vanished. It might have been moved, or the link may be broken.</p>
        <a href="index.html" class="btn btn-gold" aria-label="Return to homepage">Return to Home</a>
    </div>
</body>
</html>
