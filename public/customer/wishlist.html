<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist | Kalyan Covering</title>
    <meta name="description" content="Your curated collection of saved jewellery pieces at Kalyan Covering.">
    <link rel="icon" type="image/png" href="../assets/kalyan_logo.png">

    <!-- Preconnect & Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Jost:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/mobile.css">

    <style>
        .wishlist-hero {
            padding: 3.5rem 1.5rem 2rem;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            background: radial-gradient(circle at 50% 0%, rgba(214, 178, 94, 0.08) 0%, transparent 70%);
        }

        .wishlist-hero h1 {
            font-family: var(--font-serif);
            font-size: clamp(2.2rem, 5vw, 3.4rem);
            color: var(--text-color);
            font-weight: 500;
            letter-spacing: 1px;
            margin-bottom: 0.6rem;
        }

        .wishlist-hero h1 span {
            color: var(--gold);
            font-style: italic;
        }

        .wishlist-count-badge {
            display: inline-flex;
            align-items: center;
            background: rgba(214, 178, 94, 0.08);
            border: 1px solid var(--border-color);
            border-radius: 999px;
            padding: 0.35rem 1rem;
            color: var(--gold);
            font-size: 0.78rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 600;
            margin-top: 0.5rem;
        }

        .wishlist-page {
            max-width: 1280px;
            margin: 0 auto;
            padding: 3rem 1.5rem 6rem;
            min-height: 60vh;
        }

        .wishlist-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2rem;
        }

        @media (max-width: 1100px) {
            .wishlist-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 1.5rem;
            }
        }

        @media (max-width: 768px) {
            .wishlist-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1rem;
            }
            .wishlist-page {
                padding: 2rem 1rem 5rem;
            }
        }

        .wish-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .wish-card:hover {
            border-color: var(--gold);
            transform: translateY(-4px);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6), 0 0 20px var(--gold-glow);
        }

        .wish-card-img-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 1/1;
            background: #0d0c0a;
            overflow: hidden;
        }

        .wish-card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .wish-card:hover .wish-card-img {
            transform: scale(1.06);
        }

        .wish-remove-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 34px;
            height: 34px;
            background: rgba(6, 5, 3, 0.8);
            border: 1px solid rgba(214, 178, 94, 0.3);
            border-radius: 50%;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.25s ease;
            z-index: 5;
        }

        .wish-remove-btn:hover {
            background: rgba(220, 53, 69, 0.2);
            border-color: #dc3545;
            color: #ff6b6b;
            transform: scale(1.1);
        }

        .wish-card-body {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .wish-card-cat {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--gold);
            margin-bottom: 0.35rem;
            font-weight: 500;
        }

        .wish-card-name {
            font-family: var(--font-serif);
            font-size: 1.15rem;
            color: var(--text-color);
            line-height: 1.35;
            margin-bottom: 0.6rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 2.7rem;
        }

        .wish-card-price-row {
            display: flex;
            align-items: baseline;
            gap: 0.6rem;
            margin-bottom: 1.2rem;
        }

        .wish-card-price {
            color: var(--gold);
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .wish-card-orig-price {
            color: var(--text-muted);
            font-size: 0.85rem;
            text-decoration: line-through;
        }

        .wish-card-actions {
            margin-top: auto;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 0.5rem;
        }

        .wish-btn-cart {
            background: var(--gold-gradient);
            color: #060503;
            border: none;
            border-radius: var(--radius-sm);
            padding: 0.65rem 0.8rem;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            transition: all 0.25s ease;
        }

        .wish-btn-cart:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
            box-shadow: 0 4px 14px rgba(214, 178, 94, 0.4);
        }

        .wish-btn-view {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-dim);
            border-radius: var(--radius-sm);
            padding: 0.65rem 0.9rem;
            font-size: 0.78rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .wish-btn-view:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        .empty-wishlist {
            text-align: center;
            padding: 5rem 1.5rem;
            max-width: 500px;
            margin: 0 auto;
        }

        .empty-wishlist-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 1.5rem;
            color: var(--gold);
            opacity: 0.6;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(214, 178, 94, 0.05);
            border: 1px solid var(--border-color);
        }

        .empty-wishlist h2 {
            font-family: var(--font-serif);
            font-size: 2.2rem;
            color: var(--text-color);
            margin-bottom: 0.75rem;
            font-weight: 500;
        }

        .empty-wishlist p {
            color: var(--text-dim);
            font-size: 0.92rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
    </style>
</head>

<body>
    <!-- Skip to main content -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <main id="main-content">
        <!-- Hero -->
        <section class="wishlist-hero">
            <div class="luxury-eyebrow">YOUR SAVED TREASURES</div>
            <h1>Curated <span>Wishlist</span></h1>
            <div id="wish-badge" class="wishlist-count-badge">0 ITEMS</div>
        </section>

        <!-- Main Content -->
        <div class="wishlist-page">
            <div id="wishlist-content">
                <div style="text-align:center; padding: 4rem 0;">
                    <div class="spinner" style="width:36px;height:36px;margin:0 auto 1rem;border:2px solid rgba(214,178,94,0.2);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;"></div>
                    <p style="color:var(--text-muted); font-size:0.85rem;">Loading your saved jewellery...</p>
                </div>
            </div>
        </div>
    </main>

    <div id="toast-container" class="toast-container"></div>

    <script type="module" src="../js/app.js"></script>
    <script type="module" src="../js/utils/shellInit.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderWishlist();
        });

        function renderWishlist() {
            const wishlist = JSON.parse(localStorage.getItem('kc_wishlist') || '[]');
            const badge = document.getElementById('wish-badge');
            const content = document.getElementById('wishlist-content');
            
            if (badge) {
                badge.textContent = `${wishlist.length} ${wishlist.length === 1 ? 'PIECE' : 'PIECES'}`;
            }

            if (!wishlist || wishlist.length === 0) {
                content.innerHTML = `
                    <div class="empty-wishlist">
                        <div class="empty-wishlist-icon">
                            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                            </svg>
                        </div>
                        <h2>Your Wishlist is Empty</h2>
                        <p>Save timeless gold-covering pieces you love by tapping the heart icon as you browse our collections.</p>
                        <a href="products.html" class="btn btn-gold" style="padding:0.85rem 2rem; display:inline-block; text-decoration:none;">
                            EXPLORE ALL COLLECTIONS
                        </a>
                    </div>
                `;
                return;
            }

            content.innerHTML = `
                <div class="wishlist-grid">
                    ${wishlist.map(p => {
                        const img = p.image || (Array.isArray(p.images) ? p.images[0] : null) || 'https://images.unsplash.com/photo-1599643477877-530eb83abc8e?w=500';
                        const origPrice = p.originalPrice || (p.price ? Math.round(p.price * 1.3) : null);
                        const safeProduct = JSON.stringify(p).replace(/'/g, '&#39;');
                        
                        return `
                        <div class="wish-card" id="wish-card-${p.id}">
                            <div class="wish-card-img-wrap">
                                <img class="wish-card-img" src="${img}" alt="${p.name || 'Jewellery'}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1599643477877-530eb83abc8e?w=500'">
                                <button class="wish-remove-btn" onclick="removeFromWishlist('${p.id}')" title="Remove from wishlist" aria-label="Remove item">
                                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <line x1="18" y1="6" x2="6" y2="18"></line>
                                        <line x1="6" y1="6" x2="18" y2="18"></line>
                                    </svg>
                                </button>
                            </div>
                            <div class="wish-card-body">
                                <div class="wish-card-cat">${p.category || 'Gold Covering'}</div>
                                <h3 class="wish-card-name" title="${p.name}">${p.name}</h3>
                                <div class="wish-card-price-row">
                                    <span class="wish-card-price">₹${(p.price || 0).toLocaleString('en-IN')}</span>
                                    ${origPrice ? `<span class="wish-card-orig-price">₹${origPrice.toLocaleString('en-IN')}</span>` : ''}
                                </div>
                                <div class="wish-card-actions">
                                    <button class="wish-btn-cart" onclick='addToCartFromWish(${safeProduct}, this)'>
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <circle cx="9" cy="21" r="1"></circle>
                                            <circle cx="20" cy="21" r="1"></circle>
                                            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                                        </svg>
                                        <span>MOVE TO BAG</span>
                                    </button>
                                    <a href="product-detail.html?id=${p.id}" class="wish-btn-view" aria-label="View product">VIEW</a>
                                </div>
                            </div>
                        </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        window.removeFromWishlist = function(id) {
            let wl = JSON.parse(localStorage.getItem('kc_wishlist') || '[]');
            wl = wl.filter(p => p.id !== id);
            localStorage.setItem('kc_wishlist', JSON.stringify(wl));
            
            // Dispatch storage event / update badge
            window.dispatchEvent(new Event('kc-wishlist-updated'));
            renderWishlist();
            
            if (window.Toast) {
                Toast.info('Item removed from your wishlist');
            }
        };

        window.addToCartFromWish = function(product, btn) {
            let cart = JSON.parse(localStorage.getItem('kc_cart') || '[]');
            const existingIndex = cart.findIndex(item => item.id === product.id);
            
            if (existingIndex > -1) {
                cart[existingIndex].qty = (cart[existingIndex].qty || 1) + 1;
            } else {
                cart.push({
                    id: product.id,
                    name: product.name,
                    price: product.price,
                    image: product.image || (Array.isArray(product.images) ? product.images[0] : ''),
                    category: product.category || 'Jewellery',
                    qty: 1
                });
            }
            
            localStorage.setItem('kc_cart', JSON.stringify(cart));
            window.dispatchEvent(new Event('kc-cart-updated'));

            if (btn) {
                const origHtml = btn.innerHTML;
                btn.innerHTML = `<span>✓ ADDED</span>`;
                btn.style.background = '#28a745';
                btn.style.color = '#fff';
                setTimeout(() => {
                    btn.innerHTML = origHtml;
                    btn.style.background = '';
                    btn.style.color = '';
                }, 1500);
            }

            if (window.Toast) {
                Toast.success('Added to Bag', product.name);
            }
        };
    </script>
</body>

</html>
