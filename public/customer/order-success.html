<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed | Kalyan Covering</title>
  <meta name="description" content="Thank you for your jewellery order at Kalyan Covering. Order tracking details.">
  <link rel="icon" type="image/png" href="../assets/kalyan_logo.png">

  <!-- Fonts & Stylesheets -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/mobile.css">
</head>

<body>
  <!-- Global Shell Header Container -->
  <div id="global-header"></div>

  <!-- Main Content -->
  <main id="main-content">
    <div class="wrap">
      <div class="thanks">
        <div class="tick">
          <svg class="ic" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        </div>
        <h1 class="foil" id="thanks-name">Thank You For Your Order!</h1>
        <p style="color:var(--muted);font-size:1.05rem;margin:0.8rem 0 1.2rem;">
          Your order has been confirmed and is being hand-packed at our Erode workshop. We will share live tracking updates on WhatsApp and SMS.
        </p>

        <div class="oid" id="order-id-display">KC-ORDER</div>

        <div style="margin-top:2.5rem;" class="cta">
          <a href="my-orders.html" class="btn solid" id="track-order-link">Track Your Order</a>
          <a href="products.html" class="btn">Continue Shopping</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Global Shell Footer Container -->
  <div id="global-footer"></div>

  <!-- Scripts -->
  <script type="module" src="../js/app.js"></script>
  <script type="module" src="../js/utils/shellInit.js"></script>
  <script type="module">
    import { auth } from '../js/firebase-config.js';
    import { escapeHtml } from '../js/utils/helpers.js';

    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const orderId = params.get('orderId') || 'KC-' + Math.floor(100000 + Math.random() * 900000);
      
      const displayEl = document.getElementById('order-id-display');
      const nameEl = document.getElementById('thanks-name');
      const trackLink = document.getElementById('track-order-link');

      if (displayEl) displayEl.textContent = '#' + orderId;
      if (trackLink) trackLink.href = `my-orders.html?id=${orderId}`;

      const user = auth.currentUser || JSON.parse(localStorage.getItem('kc_user') || 'null');
      if (user && nameEl) {
        const firstName = (user.name || user.displayName || 'Valued Customer').split(' ')[0];
        nameEl.textContent = `Thank You, ${firstName}!`;
      }
    });
  </script>
</body>

</html>
