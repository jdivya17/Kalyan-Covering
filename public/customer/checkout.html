<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | Kalyan Covering Jewellery</title>
  <meta name="description" content="Complete your jewellery purchase securely at Kalyan Covering. Fast shipping across India.">
  <link rel="icon" type="image/png" href="../assets/kalyan_logo.png">

  <!-- Fonts & Stylesheets -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="../css/theme.css">
  
  <!-- Razorpay Checkout SDK -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>

<body>
  <!-- Global Shell Header Container -->
  <div id="global-header"></div>

  <!-- Main Content -->
  <main id="main-content">
    <div class="pagehead">
      <div class="wrap">
        <h1>Secure Checkout</h1>
        <div class="steps">
          <span><i>1</i> Bag</span>
          <em></em>
          <span class="on"><i>2</i> Details & Payment</span>
          <em></em>
          <span><i>3</i> Confirmation</span>
        </div>
      </div>
    </div>

    <div class="wrap">
      <div class="co" id="checkout-layout">
        <!-- Rendered by JavaScript -->
      </div>
    </div>
  </main>

  <!-- Global Shell Footer Container -->
  <div id="global-footer"></div>

  <!-- Scripts -->
  <script type="module" src="../js/app.js"></script>
  <script type="module" src="../js/utils/shellInit.js"></script>
  <script type="module">
    import { db, auth, callVercelApi } from '../js/firebase-config.js';
    import { Cart } from '../js/services/cartService.js';
    import { getUserProfile, getAddresses, addAddress } from '../js/services/userService.js';
    import { formatCurrency, escapeHtml } from '../js/utils/helpers.js';
    import { ic } from '../js/utils/icons.js';

    let savedAddresses = [];
    let selectedAddressId = null;
    let isGiftWrap = false;
    let giftMessage = '';
    let couponCode = '';

    async function initCheckoutPage() {
      const items = Cart.load() || KC.cart || [];
      const layout = document.getElementById('checkout-layout');
      if (!layout) return;

      if (!items.length) {
        layout.innerHTML = `
          <div style="grid-column:1/-1;text-align:center;padding:4rem 1rem;" class="empty">
            <h2>Your Bag is Empty</h2>
            <p style="color:var(--muted);margin:0.8rem 0 1.6rem;">Add jewellery to your bag before checking out.</p>
            <a href="products.html" class="btn solid">Browse Catalog</a>
          </div>`;
        return;
      }

      // Load User Profile & Saved Addresses
      const user = auth.currentUser || JSON.parse(localStorage.getItem('kc_user') || 'null');
      if (user) {
        savedAddresses = await getAddresses();
      }

      renderCheckoutForm(user);
    }

    function renderCheckoutForm(user) {
      const layout = document.getElementById('checkout-layout');
      const items = KC.cart || [];
      const subtotal = Cart.subtotal();
      const freeShippingLimit = 999;
      const delivery = subtotal > freeShippingLimit ? 0 : 99;
      const couponDiscount = couponCode === 'KALYAN10' ? Math.round(subtotal * 0.1) : 0;
      const giftFee = isGiftWrap ? 99 : 0;
      const grandTotal = subtotal - couponDiscount + delivery + giftFee;

      const defaultAddr = savedAddresses[0] || {};

      layout.innerHTML = `
        <!-- Left Column: Delivery Form & Payment -->
        <div>
          <!-- Saved Address Chips (if logged in) -->
          ${savedAddresses.length ? `
            <div class="box" style="margin-bottom:18px;">
              <h2>Select Saved Address</h2>
              <div class="saved-addrs">
                ${savedAddresses.map(addr => `
                  <button type="button" class="addr-chip ${selectedAddressId === addr.id ? 'active' : ''}" onclick="selectSavedAddress('${addr.id}')">
                    <b>${escapeHtml(addr.name || 'Home')}</b>
                    <small>${escapeHtml(addr.line || '')}, ${escapeHtml(addr.city || '')} ${escapeHtml(addr.pin || '')}</small>
                  </button>
                `).join('')}
              </div>
            </div>
          ` : ''}

          <!-- Delivery Address Form -->
          <form id="coForm" onsubmit="handlePlaceOrder(event)" novalidate>
            <div class="box">
              <h2>Delivery Address</h2>
              <div class="fgrid2">
                <label class="f full">Full Name *
                  <input type="text" id="f-name" autocomplete="name" value="${escapeHtml(defaultAddr.name || user?.name || user?.displayName || '')}" required />
                  <span class="err" id="err-name"></span>
                </label>
                
                <label class="f">Mobile Number *
                  <input type="tel" id="f-phone" inputmode="numeric" maxlength="10" autocomplete="tel" value="${escapeHtml(defaultAddr.phone || user?.phone || user?.phoneNumber || '')}" required />
                  <span class="err" id="err-phone"></span>
                </label>

                <label class="f">Email Address *
                  <input type="email" id="f-email" autocomplete="email" value="${escapeHtml(user?.email || '')}" required />
                  <span class="err" id="err-email"></span>
                </label>

                <label class="f full">Street Address *
                  <textarea id="f-addr" rows="2" autocomplete="street-address" required>${escapeHtml(defaultAddr.line || '')}</textarea>
                  <span class="err" id="err-addr"></span>
                </label>

                <label class="f">City *
                  <input type="text" id="f-city" autocomplete="address-level2" value="${escapeHtml(defaultAddr.city || '')}" required />
                  <span class="err" id="err-city"></span>
                </label>

                <label class="f">State *
                  <input type="text" id="f-state" autocomplete="address-level1" value="${escapeHtml(defaultAddr.state || 'Tamil Nadu')}" required />
                  <span class="err" id="err-state"></span>
                </label>

                <label class="f full">Pincode *
                  <input type="text" id="f-pin" inputmode="numeric" maxlength="6" autocomplete="postal-code" value="${escapeHtml(defaultAddr.pin || '')}" required />
                  <span class="err" id="err-pin"></span>
                </label>
              </div>

              <label class="ck" style="margin-top:14px;">
                <input type="checkbox" id="f-save" ${savedAddresses.length === 0 ? 'checked' : ''} />
                <span>Save this address to my profile for future orders</span>
              </label>
            </div>

            <!-- Gift Wrap Option -->
            <div class="box">
              <h2>Gift Options</h2>
              <label class="ck">
                <input type="checkbox" id="f-gift" ${isGiftWrap ? 'checked' : ''} onchange="toggleGiftWrap(this.checked)" />
                <span>Add signature velvet gift wrap & gift card (+₹99)</span>
              </label>
              <div id="gift-message-box" style="margin-top:12px; ${isGiftWrap ? '' : 'display:none;'}">
                <label class="f">Message on Gift Card
                  <textarea id="f-giftmsg" rows="2" maxlength="140" placeholder="Happy Anniversary / Happy Birthday!">${escapeHtml(giftMessage)}</textarea>
                </label>
              </div>
            </div>

            <!-- Payment Options -->
            <div class="box">
              <h2>Payment Method</h2>
              <div class="pay">
                <label class="opt active">
                  <input type="radio" name="payMethod" value="ONLINE" checked />
                  <span>
                    <b>Razorpay (UPI, GPay, Credit/Debit Card, Netbanking)</b>
                    <small>Instant secure payment gateway</small>
                  </span>
                </label>
                <label class="opt">
                  <input type="radio" name="payMethod" value="COD" />
                  <span>
                    <b>Cash on Delivery (COD)</b>
                    <small>Pay with cash when your package is delivered (+₹50 COD fee applies)</small>
                  </span>
                </label>
              </div>
            </div>

            <!-- Place Order CTA Button -->
            <button type="submit" class="btn solid block" style="margin-top:1.5rem;padding:1.1rem;" id="place-order-btn">
              <span>Place Order Securely • ${formatCurrency(grandTotal)}</span>
            </button>
          </form>
        </div>

        <!-- Right Column: Order Summary Sidebar -->
        <div class="sumcol">
          <div class="box">
            <h2>Order Summary (${items.reduce((s, i) => s + (i.qty || 1), 0)})</h2>
            
            <div style="max-height:280px;overflow-y:auto;margin-bottom:1rem;">
              ${items.map(item => `
                <div class="li">
                  <img src="${item.image || item.primaryImageURL || item.images?.[0] || '/img-fallback.svg'}" alt="${escapeHtml(item.name)}" />
                  <div>
                    <b>${escapeHtml(item.name)}</b>
                    <small>Qty ${item.qty || 1}</small>
                  </div>
                  <span style="color:var(--gold-hi);font-weight:500;">${formatCurrency(item.price * (item.qty || 1))}</span>
                </div>
              `).join('')}
            </div>

            <!-- Coupon Code Input -->
            <div class="cpn">
              <input type="text" id="co-coupon" placeholder="Coupon Code" value="${couponCode}" />
              <button class="btn sm" type="button" onclick="applyCheckoutCoupon()">Apply</button>
            </div>
            ${couponCode === 'KALYAN10' ? `<div style="color:var(--ok);font-size:0.85rem;margin-top:0.4rem;">✓ Coupon KALYAN10 applied (10% OFF)</div>` : ''}

            <!-- Totals -->
            <div class="tot">
              <div><span>Subtotal</span><span>${formatCurrency(subtotal)}</span></div>
              ${couponDiscount ? `<div><span>Coupon Discount</span><span style="color:var(--ok)">-${formatCurrency(couponDiscount)}</span></div>` : ''}
              <div><span>Delivery Charge</span><span>${delivery === 0 ? '<b style="color:var(--ok)">FREE</b>' : formatCurrency(delivery)}</span></div>
              ${isGiftWrap ? `<div><span>Gift Wrap</span><span>${formatCurrency(99)}</span></div>` : ''}
              <div class="grand">
                <span>Total Amount</span>
                <span>${formatCurrency(grandTotal)}</span>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    window.selectSavedAddress = function(id) {
      selectedAddressId = id;
      const addr = savedAddresses.find(a => a.id === id);
      if (!addr) return;

      document.getElementById('f-name').value = addr.name || '';
      document.getElementById('f-phone').value = addr.phone || '';
      document.getElementById('f-addr').value = addr.line || '';
      document.getElementById('f-city').value = addr.city || '';
      document.getElementById('f-state').value = addr.state || 'Tamil Nadu';
      document.getElementById('f-pin').value = addr.pin || '';
    };

    window.toggleGiftWrap = function(enabled) {
      isGiftWrap = enabled;
      const box = document.getElementById('gift-message-box');
      if (box) box.style.display = enabled ? 'block' : 'none';
      const user = auth.currentUser || JSON.parse(localStorage.getItem('kc_user') || 'null');
      renderCheckoutForm(user);
    };

    window.applyCheckoutCoupon = function() {
      const input = document.getElementById('co-coupon');
      if (!input) return;
      const code = input.value.trim().toUpperCase();
      if (code === 'KALYAN10') {
        couponCode = 'KALYAN10';
      } else {
        couponCode = '';
        alert('Invalid coupon code. Try "KALYAN10" for 10% off.');
      }
      const user = auth.currentUser || JSON.parse(localStorage.getItem('kc_user') || 'null');
      renderCheckoutForm(user);
    };

    // Inline Form Validation
    function validateCheckoutForm() {
      let isValid = true;
      const clearError = (id) => { const el = document.getElementById(id); if (el) el.textContent = ''; };
      const setError = (id, msg) => { const el = document.getElementById(id); if (el) el.textContent = msg; isValid = false; };

      ['err-name', 'err-phone', 'err-email', 'err-addr', 'err-city', 'err-state', 'err-pin'].forEach(clearError);

      const name = document.getElementById('f-name')?.value.trim();
      const phone = document.getElementById('f-phone')?.value.trim();
      const email = document.getElementById('f-email')?.value.trim();
      const addr = document.getElementById('f-addr')?.value.trim();
      const city = document.getElementById('f-city')?.value.trim();
      const state = document.getElementById('f-state')?.value.trim();
      const pin = document.getElementById('f-pin')?.value.trim();

      if (!name) setError('err-name', 'Full name is required');
      if (!phone || !/^\d{10}$/.test(phone)) setError('err-phone', 'Enter valid 10-digit mobile number');
      if (!email || !/\S+@\S+\.\S+/.test(email)) setError('err-email', 'Enter valid email address');
      if (!addr) setError('err-addr', 'Street address is required');
      if (!city) setError('err-city', 'City is required');
      if (!state) setError('err-state', 'State is required');
      if (!pin || !/^\d{6}$/.test(pin)) setError('err-pin', 'Enter valid 6-digit pincode');

      return isValid;
    }

    // Handle Order Submission
    window.handlePlaceOrder = async function(e) {
      e.preventDefault();
      if (!validateCheckoutForm()) return;

      const btn = document.getElementById('place-order-btn');
      if (btn) {
        btn.disabled = true;
        btn.textContent = 'Processing Order...';
      }

      const shippingAddress = {
        name: document.getElementById('f-name').value.trim(),
        phone: document.getElementById('f-phone').value.trim(),
        email: document.getElementById('f-email').value.trim(),
        line: document.getElementById('f-addr').value.trim(),
        city: document.getElementById('f-city').value.trim(),
        state: document.getElementById('f-state').value.trim(),
        pin: document.getElementById('f-pin').value.trim()
      };

      // Save Address if checked
      const saveChecked = document.getElementById('f-save')?.checked;
      if (saveChecked && auth.currentUser) {
        try {
          await addAddress(shippingAddress);
        } catch (_) {}
      }

      const items = Cart.toOrderItems();
      const payMethod = document.querySelector('input[name="payMethod"]:checked')?.value || 'ONLINE';

      try {
        if (payMethod === 'ONLINE') {
          // Razorpay Online Payment Flow via Backend Vercel API
          const orderRes = await callVercelApi('/api/payments/create-order', {
            items,
            shippingAddress,
            couponCode,
            isGiftWrap
          });

          if (!orderRes || !orderRes.orderId) {
            throw new Error(orderRes.error || 'Failed to initialize payment gateway.');
          }

          const options = {
            key: orderRes.key || "rzp_live_default",
            amount: orderRes.amount,
            currency: "INR",
            name: "Kalyan Covering",
            description: "Gold Covering Jewellery Order",
            order_id: orderRes.razorpayOrderId,
            prefill: {
              name: shippingAddress.name,
              email: shippingAddress.email,
              contact: shippingAddress.phone
            },
            theme: { color: "#d6b25e" },
            handler: async function (response) {
              // Verify payment on backend
              try {
                const verifyRes = await callVercelApi('/api/payments/verify-payment', {
                  razorpayOrderId: response.razorpay_order_id,
                  razorpayPaymentId: response.razorpay_payment_id,
                  razorpaySignature: response.razorpay_signature,
                  orderId: orderRes.orderId
                });

                if (verifyRes && verifyRes.success) {
                  Cart.clear();
                  window.location.href = `order-success.html?orderId=${orderRes.orderId}`;
                } else {
                  alert('Payment verification failed. Please contact support.');
                }
              } catch (err) {
                alert('Payment verification error: ' + err.message);
              }
            }
          };

          const rzp = new window.Razorpay(options);
          rzp.open();
        } else {
          // Cash On Delivery (COD) Flow
          const codRes = await callVercelApi('/api/orders/create-cod-order', {
            items,
            shippingAddress,
            couponCode,
            isGiftWrap
          });

          if (codRes && codRes.orderId) {
            Cart.clear();
            window.location.href = `order-success.html?orderId=${codRes.orderId}`;
          } else {
            throw new Error(codRes.error || 'Failed to place COD order.');
          }
        }
      } catch (err) {
        console.error('Checkout error:', err);
        alert(err.message || 'Unable to process checkout. Please try again.');
        if (btn) {
          btn.disabled = false;
          btn.textContent = 'Place Order Securely';
        }
      }
    };

    document.addEventListener('DOMContentLoaded', initCheckoutPage);
  </script>
</body>

</html>
