<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Details | Kalyan Covering</title>
  <meta name="description" content="View details of your order at Kalyan Covering.">
  <link rel="icon" type="image/png" href="../assets/kalyan_logo.png">
  
  <!-- Preconnect & Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Jost:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/design-system.css">

  <style>
    .order-details-page {
      max-width: 1000px;
      margin: 0 auto;
      padding: 3.5rem 1.5rem 6rem;
      min-height: 70vh;
    }

    .order-back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--gold);
      text-decoration: none;
      font-size: 0.82rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 500;
      margin-bottom: 1.5rem;
      transition: opacity 0.2s;
    }

    .order-back-btn:hover {
      opacity: 0.8;
    }

    .order-card-container {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 2.2rem;
      box-shadow: 0 16px 40px rgba(0,0,0,0.5);
    }

    .order-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1.5rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .order-title {
      font-family: var(--font-serif);
      font-size: 1.6rem;
      color: var(--text-color);
      font-weight: 500;
      margin-bottom: 0.25rem;
    }

    .order-date {
      color: var(--text-dim);
      font-size: 0.82rem;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .status-badge.placed, .status-badge.processing {
      background: rgba(214, 178, 94, 0.12);
      color: var(--gold);
      border: 1px solid rgba(214, 178, 94, 0.3);
    }

    .status-badge.shipped {
      background: rgba(52, 152, 219, 0.12);
      color: #3498db;
      border: 1px solid rgba(52, 152, 219, 0.3);
    }

    .status-badge.delivered {
      background: rgba(40, 167, 69, 0.12);
      color: #2ecc71;
      border: 1px solid rgba(40, 167, 69, 0.3);
    }

    .status-badge.cancelled {
      background: rgba(220, 53, 69, 0.12);
      color: #e74c3c;
      border: 1px solid rgba(220, 53, 69, 0.3);
    }

    .order-layout-grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 2rem;
    }

    @media (max-width: 800px) {
      .order-layout-grid {
        grid-template-columns: 1fr;
      }
      .order-details-page {
        padding: 2rem 1rem 5rem;
      }
      .order-card-container {
        padding: 1.5rem;
      }
    }

    .order-section-heading {
      font-family: var(--font-serif);
      font-size: 1.25rem;
      color: var(--text-color);
      margin-bottom: 1.2rem;
      font-weight: 500;
    }

    .order-item-card {
      display: flex;
      gap: 1rem;
      align-items: center;
      background: #090807;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 1rem;
      margin-bottom: 0.8rem;
    }

    .order-item-img {
      width: 64px;
      height: 64px;
      border-radius: var(--radius-sm);
      object-fit: cover;
      background: #111;
      border: 1px solid var(--border-color);
    }

    .order-item-name {
      font-family: var(--font-serif);
      font-size: 1.05rem;
      color: var(--text-color);
      margin-bottom: 0.25rem;
      line-height: 1.3;
    }

    .order-item-meta {
      font-size: 0.78rem;
      color: var(--text-dim);
    }

    .order-item-price {
      font-size: 0.95rem;
      color: var(--gold);
      font-weight: 600;
      margin-top: 0.2rem;
    }

    .order-side-panel {
      background: #090807;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .order-side-block h4 {
      font-family: var(--font-serif);
      font-size: 1.1rem;
      color: var(--gold);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.4rem;
      margin-bottom: 0.6rem;
      font-weight: 500;
    }

    .order-side-block p {
      color: var(--text-dim);
      font-size: 0.85rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <!-- Skip to main content -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- ===== MAIN CONTENT ===== -->
  <main id="main-content" class="order-details-page">
    <a href="my-orders.html" class="order-back-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span>Back to My Orders</span>
    </a>

    <div class="order-card-container">
      <div class="order-header-bar">
        <div>
          <h1 id="detail-order-id" class="order-title">Loading Order...</h1>
          <p id="detail-order-date" class="order-date"></p>
        </div>
        <span id="detail-order-status" class="status-badge processing">Processing</span>
      </div>

      <div class="order-layout-grid">
        <div>
          <h2 class="order-section-heading">Items in Order</h2>
          <div id="detail-order-items">
            <div style="padding: 2rem 0; text-align: center; color: var(--text-muted);">Loading items...</div>
          </div>
        </div>

        <div class="order-side-panel">
          <div class="order-side-block">
            <h4>Delivery Address</h4>
            <p id="detail-shipping-address">Shipping details pending</p>
          </div>

          <div class="order-side-block">
            <h4>Payment Information</h4>
            <p id="detail-payment-method">Payment Method: Online</p>
          </div>

          <div style="border-top: 1px solid var(--border-color); padding-top: 1rem;">
            <a id="btn-print-invoice" href="invoice.html" class="btn btn-gold" style="display: block; text-align: center; text-decoration: none; padding: 0.75rem;">
              VIEW / DOWNLOAD INVOICE
            </a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="toast-container" class="toast-container"></div>

  <script type="module" src="../js/app.js"></script>
  <script type="module" src="../js/utils/shellInit.js"></script>
  <script type="module">
    import { getOrder } from '../js/services/orderService.js';
    import { formatCurrency } from '../js/utils/helpers.js';

    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      const orderId = params.get('id');
      if (!orderId) {
        window.location.href = 'my-orders.html';
        return;
      }

      try {
        const order = await getOrder(orderId);
        if (order) {
          document.getElementById('detail-order-id').textContent = 'Order #' + (order.orderNumber || order.id);
          document.getElementById('detail-order-date').textContent = order.createdAt ? new Date(order.createdAt).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
          
          const statusEl = document.getElementById('detail-order-status');
          if (statusEl) {
            const st = (order.status || 'processing').toLowerCase();
            statusEl.textContent = st.charAt(0).toUpperCase() + st.slice(1);
            statusEl.className = `status-badge ${st}`;
          }

          if (order.shippingAddress) {
            const addr = order.shippingAddress;
            document.getElementById('detail-shipping-address').innerHTML = `
              <strong>${addr.fullName || addr.name || ''}</strong><br>
              ${addr.street || addr.address || ''}<br>
              ${addr.city || ''}, ${addr.state || ''} ${addr.pincode || addr.pin || ''}<br>
              Phone: ${addr.phone || ''}
            `;
          }

          if (order.paymentMethod) {
            document.getElementById('detail-payment-method').textContent = `Payment Method: ${order.paymentMethod.toUpperCase()}`;
          }

          const itemsContainer = document.getElementById('detail-order-items');
          if (itemsContainer && order.items && order.items.length) {
            itemsContainer.innerHTML = order.items.map(item => `
              <div class="order-item-card">
                <img class="order-item-img" src="${item.image || item.images?.[0] || 'https://images.unsplash.com/photo-1599643477877-530eb83abc8e?w=200'}" alt="${item.name}" onerror="this.src='https://images.unsplash.com/photo-1599643477877-530eb83abc8e?w=200'">
                <div style="flex:1;">
                  <div class="order-item-name">${item.name}</div>
                  <div class="order-item-meta">Qty: ${item.qty || item.quantity || 1}</div>
                  <div class="order-item-price">₹${((item.price || 0) * (item.qty || item.quantity || 1)).toLocaleString('en-IN')}</div>
                </div>
              </div>
            `).join('');
          }

          const printBtn = document.getElementById('btn-print-invoice');
          if (printBtn) {
            printBtn.href = `invoice.html?id=${order.id || orderId}`;
          }
        }
      } catch (e) {
        console.error('Error fetching order details:', e);
      }
    });
  </script>
</body>
</html>
