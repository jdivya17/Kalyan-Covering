<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Details | Kalyan Covering</title>
  <meta name="description" content="View details of your order at Kalyan Covering.">
  <meta property="og:title" content="Order Details | Kalyan Covering">
  <meta property="og:description" content="View details and live tracking for your jewellery order at Kalyan Covering.">
  <meta property="og:image" content="../assets/kalyan_logo.png">
  <link rel="icon" type="image/png" href="../assets/kalyan_logo.png">
  
  <!-- Preconnect & Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Jost:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/design-system.css">
  <link rel="stylesheet" href="../css/mobile.css">

  <style>
    .order-details-page {
      max-width: 1000px;
      margin: 0 auto;
      padding: 3.5rem 1.5rem 6rem;
      min-height: 70vh;
    }

    .order-back-btn {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--gold);
      text-decoration: none;
      font-size: 0.82rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 500;
      margin-bottom: 1.5rem;
      transition: opacity 0.2s;
    }

    .order-back-btn:hover {
      opacity: 0.8;
    }

    .order-card-container {
      background: var(--surface, #14110b);
      border: 1px solid var(--line, rgba(214, 178, 94, 0.24));
      border-radius: 6px;
      padding: 2.2rem;
      box-shadow: 0 16px 40px rgba(0,0,0,0.5);
    }

    .order-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--line, rgba(214, 178, 94, 0.24));
      padding-bottom: 1.5rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .order-title {
      overflow-wrap: anywhere;
      word-break: break-word;
      font-family: var(--font-serif);
      font-size: 1.6rem;
      color: var(--ivory, #f3ead6);
      font-weight: 500;
      margin-bottom: 0.25rem;
    }

    .order-date {
      color: var(--muted, #a99f8a);
      font-size: 0.82rem;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .status-badge.placed, .status-badge.processing {
      background: rgba(214, 178, 94, 0.12);
      color: var(--gold);
      border: 1px solid rgba(214, 178, 94, 0.3);
    }

    .status-badge.shipped {
      background: rgba(52, 152, 219, 0.12);
      color: #3498db;
      border: 1px solid rgba(52, 152, 219, 0.3);
    }

    .status-badge.delivered {
      background: rgba(40, 167, 69, 0.12);
      color: #2ecc71;
      border: 1px solid rgba(40, 167, 69, 0.3);
    }

    .status-badge.cancelled {
      background: rgba(220, 53, 69, 0.12);
      color: #e74c3c;
      border: 1px solid rgba(220, 53, 69, 0.3);
    }

    .order-layout-grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 2rem;
    }

    @media (max-width: 800px) {
      .order-layout-grid {
        grid-template-columns: 1fr;
      }
      .order-details-page {
        padding: 2rem 1rem 5rem;
      }
      .order-card-container {
        padding: 1.5rem;
      }
    }

    .order-section-heading {
      font-family: var(--font-serif);
      font-size: 1.25rem;
      color: var(--ivory, #f3ead6);
      margin-bottom: 1.2rem;
      font-weight: 500;
    }

    .order-item-card {
      display: flex;
      gap: 1rem;
      align-items: center;
      background: #090807;
      border: 1px solid var(--line, rgba(214, 178, 94, 0.24));
      border-radius: 2px;
      padding: 1rem;
      margin-bottom: 0.8rem;
    }

    .order-item-img {
      width: 64px;
      height: 64px;
      border-radius: 2px;
      object-fit: cover;
      background: #111;
      border: 1px solid var(--line, rgba(214, 178, 94, 0.24));
    }

    .order-item-name {
      font-family: var(--font-serif);
      font-size: 1.05rem;
      color: var(--ivory, #f3ead6);
      margin-bottom: 0.25rem;
      line-height: 1.3;
    }

    .order-item-meta {
      font-size: 0.78rem;
      color: var(--muted, #a99f8a);
    }

    .order-item-price {
      font-size: 0.95rem;
      color: var(--gold);
      font-weight: 600;
      margin-top: 0.2rem;
    }

    .order-side-panel {
      background: #090807;
      border: 1px solid var(--line, rgba(214, 178, 94, 0.24));
      border-radius: 4px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .order-side-block h4 {
      font-family: var(--font-serif);
      font-size: 1.1rem;
      color: var(--gold);
      border-bottom: 1px solid var(--line, rgba(214, 178, 94, 0.24));
      padding-bottom: 0.4rem;
      margin-bottom: 0.6rem;
      font-weight: 500;
    }

    .order-side-block p {
      color: var(--muted, #a99f8a);
      font-size: 0.85rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <!-- Skip to main content -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- ===== MAIN CONTENT ===== -->
  <main id="main-content" class="order-details-page">
    <a href="my-orders.html" class="order-back-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span>Back to My Orders</span>
    </a>

    <div class="order-card-container">
      <div class="order-header-bar">
        <div>
          <h1 id="detail-order-id" class="order-title">Loading Order...</h1>
          <p id="detail-order-date" class="order-date"></p>
        </div>
        <span id="detail-order-status" class="status-badge processing">Processing</span>
      </div>

      
      <!-- Order Live Tracking Tracker -->
      <div id="detail-tracking-section" style="margin-bottom: 2rem; display: none;">
        <h2 class="order-section-heading">Order Status &amp; Tracking</h2>
        <div id="detail-tracking-content" class="box" style="padding: 1.25rem; background: #090807; border: 1px solid var(--line); border-radius: 4px;"></div>
      </div>

      <div class="order-layout-grid">
        <div>
          <h2 class="order-section-heading">Items in Order</h2>
          <div id="detail-order-items">
            <div style="padding: 2rem 0; text-align: center; color: var(--text-muted);">Loading items...</div>
          </div>
        </div>

        <div class="order-side-panel">
          <div class="order-side-block">
            <h4>Delivery Address</h4>
            <p id="detail-shipping-address">Shipping details pending</p>
          </div>

          <div class="order-side-block">
            <h4>Payment Information</h4>
            <p id="detail-payment-method">Payment Method: Online</p>
          </div>

          <div style="border-top: 1px solid var(--line, rgba(214, 178, 94, 0.24)); padding-top: 1rem;">
            <a id="btn-print-invoice" href="invoice.html" class="btn btn-gold" style="display: block; text-align: center; text-decoration: none; padding: 0.85rem; min-height: 48px; display: flex; align-items: center; justify-content: center; font-weight: 600;">
              VIEW / DOWNLOAD INVOICE
            </a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="toast-container" class="toast-container"></div>

  <script type="module" src="../js/app.js"></script>
  <script type="module" src="../js/utils/shellInit.js"></script>
  <script type="module">
    import { getOrder } from '../js/services/orderService.js';
    import { formatCurrency, escapeHtml } from '../js/utils/helpers.js';
    import { generateInvoicePDF } from '../js/utils/invoiceGenerator.js';

    function renderTracking(order) {
      const section = document.getElementById('detail-tracking-section');
      const content = document.getElementById('detail-tracking-content');
      if (!section || !content) return;

      const sd = order.shippingDetails || {};
      const awb = sd.awbCode || sd.trackingNumber || null;
      const carrier = sd.courierName || sd.carrier || null;
      const rawTrackUrl = sd.trackingUrl || (awb ? `https://shiprocket.co/tracking/${awb}` : null);
      const safeTrackUrl = (typeof rawTrackUrl === 'string' && rawTrackUrl.startsWith('https://'))
        ? encodeURI(rawTrackUrl)
        : null;
      const history = Array.isArray(order.statusHistory) ? order.statusHistory : [];

      let html = '';

      if (awb || carrier) {
        html += `
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; padding:1rem; background:rgba(214,178,94,0.05); border:1px solid rgba(214,178,94,0.2); border-radius:4px; margin-bottom:1.5rem;">
            <div>
              ${carrier ? `<div style="font-size:0.85rem; color:var(--muted,#a99f8a); margin-bottom:4px;">Courier Partner: <b style="color:var(--ivory,#f3ead6);">${escapeHtml(carrier)}</b></div>` : ''}
              ${awb ? `
                <div style="font-size:0.88rem; color:var(--muted,#a99f8a); display:flex; align-items:center; gap:8px;">
                  <span>AWB / Tracking: <b style="color:var(--gold,#d6b25e);">${escapeHtml(awb)}</b></span>
                  <button type="button" class="copy-awb-btn" data-awb="${escapeHtml(awb)}" style="background:transparent; border:1px solid rgba(214,178,94,0.4); color:var(--gold,#d6b25e); border-radius:3px; padding:2px 8px; font-size:0.75rem; cursor:pointer;">Copy</button>
                </div>
              ` : ''}
            </div>
            ${safeTrackUrl ? `
              <a href="${escapeHtml(safeTrackUrl)}" target="_blank" rel="noopener" class="btn btn-gold" style="padding:0.5rem 1rem; font-size:0.85rem; text-decoration:none; display:inline-flex; align-items:center; gap:6px;">
                <span>Track on Carrier</span> ↗
              </a>
            ` : ''}
          </div>
        `;
      } else {
        html += `
          <div style="padding:1rem; background:rgba(255,255,255,0.02); border:1px solid rgba(214,178,94,0.15); border-radius:4px; margin-bottom:1.5rem; color:var(--muted,#a99f8a); font-size:0.9rem;">
            Your order is being prepared. Tracking will appear after dispatch.
          </div>
        `;
      }

      if (history.length > 0) {
        html += `
          <div style="margin-top:1rem;">
            <h4 style="font-size:0.95rem; color:var(--gold,#d6b25e); margin-bottom:0.75rem; font-weight:600; text-transform:uppercase; letter-spacing:0.5px;">Status Updates</h4>
            <ol style="list-style:none; padding:0 0 0 1.2rem; margin:0; position:relative; border-left:2px solid rgba(214,178,94,0.2);">
              ${history.map((h) => {
                const rawTime = h.changedAt || h.timestamp;
                const dateObj = rawTime?.toDate ? rawTime.toDate() : (rawTime ? new Date(rawTime) : null);
                const timeStr = dateObj && !isNaN(dateObj.getTime())
                  ? dateObj.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) + ' • ' + dateObj.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' })
                  : '';
                const statusName = String(h.status || '').replace(/_/g, ' ').toUpperCase();
                const note = h.note || '';

                return `
                  <li style="position:relative; margin-bottom:1.25rem; padding-left:0.8rem;">
                    <span style="position:absolute; left:-1.75rem; top:2px; width:10px; height:10px; border-radius:50%; background:var(--gold,#d6b25e); box-shadow:0 0 8px rgba(214,178,94,0.6);"></span>
                    <div style="font-size:0.9rem; font-weight:600; color:var(--ivory,#f3ead6);">${escapeHtml(statusName)}</div>
                    ${timeStr ? `<div style="font-size:0.78rem; color:var(--gold-hi,#f5e0a3); margin-top:2px;">${escapeHtml(timeStr)}</div>` : ''}
                    ${note ? `<div style="font-size:0.82rem; color:var(--muted,#a99f8a); margin-top:3px;">${escapeHtml(note)}</div>` : ''}
                  </li>
                `;
              }).join('')}
            </ol>
          </div>
        `;
      }

      content.innerHTML = html;
      section.style.display = 'block';

      // Attach clipboard listener using data-awb
      const copyBtn = content.querySelector('.copy-awb-btn');
      if (copyBtn) {
        copyBtn.addEventListener('click', () => {
          const awbVal = copyBtn.getAttribute('data-awb') || '';
          if (!awbVal || !navigator.clipboard) return;
          navigator.clipboard.writeText(awbVal).then(() => {
            const prev = copyBtn.textContent;
            copyBtn.textContent = 'Copied!';
            setTimeout(() => { copyBtn.textContent = prev; }, 2000);
          }).catch(() => {});
        });
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      const orderId = params.get('id') || params.get('orderId');
      if (!orderId) {
        window.location.href = 'my-orders.html';
        return;
      }

      try {
        const order = await getOrder(orderId);
        if (order) {
          document.getElementById('detail-order-id').textContent = 'Order #' + (order.orderNumber || order.id);
          document.getElementById('detail-order-date').textContent = order.createdAt ? new Date(order.createdAt).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
          
          renderTracking(order);
          
          const statusEl = document.getElementById('detail-order-status');
          if (statusEl) {
            const st = (order.status || 'processing').toLowerCase();
            statusEl.textContent = st.charAt(0).toUpperCase() + st.slice(1);
            statusEl.className = `status-badge ${st}`;
          }

          if (order.shippingAddress) {
            const addr = order.shippingAddress;
            document.getElementById('detail-shipping-address').innerHTML = `
              <strong>${addr.fullName || addr.name || ''}</strong><br>
              ${addr.street || addr.address || ''}<br>
              ${addr.city || ''}, ${addr.state || ''} ${addr.pincode || addr.pin || ''}<br>
              Phone: ${addr.phone || ''}
            `;
          }

          if (order.paymentMethod) {
            document.getElementById('detail-payment-method').textContent = `Payment Method: ${order.paymentMethod.toUpperCase()}`;
          }

          const itemsContainer = document.getElementById('detail-order-items');
          if (itemsContainer && order.items && order.items.length) {
            itemsContainer.innerHTML = order.items.map(item => `
              <div class="order-item-card">
                <img class="order-item-img" src="${item.image || item.images?.[0] || 'https://images.unsplash.com/photo-1599643477877-530eb83abc8e?w=200'}" alt="${item.name}" onerror="this.src='https://images.unsplash.com/photo-1599643477877-530eb83abc8e?w=200'">
                <div style="flex:1;">
                  <div class="order-item-name">${item.name}</div>
                  <div class="order-item-meta">Qty: ${item.qty || item.quantity || 1}</div>
                  <div class="order-item-price">₹${((item.price || 0) * (item.qty || item.quantity || 1)).toLocaleString('en-IN')}</div>
                </div>
              </div>
            `).join('');
          }

          const printBtn = document.getElementById('btn-print-invoice');
          if (printBtn) {
            printBtn.onclick = async (e) => {
              e.preventDefault();
              try {
                if (window.Toast) Toast.info('Generating PDF Invoice...');
                await generateInvoicePDF(order);
                if (window.Toast) Toast.success('Invoice Downloaded', `Invoice for Order #${order.orderNumber || order.id}`);
              } catch (err) {
                window.location.href = `invoice.html?id=${order.id || orderId}`;
              }
            };
          }
        }
      } catch (e) {
        console.error('Error fetching order details:', e);
      }
    });
  </script>
</body>
</html>
