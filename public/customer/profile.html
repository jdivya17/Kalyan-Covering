<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account | Kalyan Covering</title>
  <meta name="description" content="Manage your profile, view orders, track packages, manage saved addresses and refunds at Kalyan Covering.">
  <link rel="icon" type="image/png" href="../assets/kalyan_logo.png">

  <!-- Fonts & Stylesheets -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="../css/theme.css">
</head>

<body>
  <!-- Global Shell Header Container -->
  <div id="global-header"></div>

  <!-- Main Content -->
  <main id="main-content">
    <div class="pagehead">
      <div class="wrap">
        <h1>My Account</h1>
        <p id="account-sub-email">Signed in to Kalyan Covering</p>
      </div>
    </div>

    <div class="wrap">
      <div class="acc">
        <!-- Sidebar Navigation -->
        <nav class="accnav" aria-label="Account Menu">
          <a href="#profile" class="acc-tab-btn active" data-tab="profile">
            <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
            <span>Profile</span>
          </a>
          <a href="my-orders.html" class="acc-tab-btn" data-tab="orders">
            <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg>
            <span>Orders & Tracking</span>
          </a>
          <a href="#addresses" class="acc-tab-btn" data-tab="addresses">
            <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 21s7-6 7-11a7 7 0 10-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
            <span>Saved Addresses</span>
          </a>
          <a href="wishlist.html" class="acc-tab-btn" data-tab="wishlist">
            <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 20s-7-4.6-9-9.2C1.7 7.4 3.8 4 7.2 4c2 0 3.6 1.1 4.8 2.9C13.2 5.1 14.8 4 16.8 4 20.2 4 22.3 7.4 21 10.8 19 15.4 12 20 12 20z"/></svg>
            <span>Wishlist</span>
          </a>
          <a href="my-orders.html#returns" class="acc-tab-btn" data-tab="returns">
            <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 9h12a4 4 0 010 8H8"/><path d="M8 5L4 9l4 4"/></svg>
            <span>Returns & Refunds</span>
          </a>
          <button type="button" onclick="window.logoutUser()">
            <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></svg>
            <span>Log Out</span>
          </button>
        </nav>

        <!-- Main Account Content Pane -->
        <div class="accmain" id="account-main-content">
          <!-- Rendered dynamically based on hash / tab -->
        </div>
      </div>
    </div>
  </main>

  <!-- Global Shell Footer Container -->
  <div id="global-footer"></div>

  <!-- Scripts -->
  <script type="module" src="../js/app.js"></script>
  <script type="module" src="../js/utils/shellInit.js"></script>
  <script type="module">
    import { auth, db } from '../js/firebase-config.js';
    import { getUserProfile, updateProfile, getAddresses, addAddress, updateAddress, deleteAddress } from '../js/services/userService.js';
    import { escapeHtml, formatCurrency } from '../js/utils/helpers.js';
    import { ic } from '../js/utils/icons.js';

    let currentTab = window.location.hash ? window.location.hash.replace('#', '') : 'profile';
    let editAddressId = null; // 'new' or address ID

    async function initAccountPage() {
      const user = auth.currentUser || JSON.parse(localStorage.getItem('kc_user') || 'null');
      if (!user) {
        window.location.href = 'auth.html';
        return;
      }

      const subEmail = document.getElementById('account-sub-email');
      if (subEmail) subEmail.textContent = `Signed in as ${user.email || user.phone || 'Customer'}`;

      window.addEventListener('hashchange', () => {
        currentTab = window.location.hash.replace('#', '') || 'profile';
        renderAccountTab(user);
      });

      renderAccountTab(user);
    }

    async function renderAccountTab(user) {
      document.querySelectorAll('.acc-tab-btn').forEach(btn => {
        const isCurrent = btn.dataset.tab === currentTab;
        btn.classList.toggle('active', isCurrent);
        btn.setAttribute('aria-current', isCurrent ? 'true' : 'false');
      });

      const container = document.getElementById('account-main-content');
      if (!container) return;

      if (currentTab === 'addresses') {
        const addresses = await getAddresses();
        renderAddressesTab(container, user, addresses);
      } else {
        // Default to Profile Tab
        const profile = await getUserProfile() || user;
        renderProfileTab(container, profile);
      }
    }

    function renderProfileTab(container, user) {
      const name = user.name || user.displayName || 'Customer';
      const initial = name.charAt(0).toUpperCase();

      container.innerHTML = `
        <h2 class="t">Edit Profile</h2>
        <div class="box">
          <div class="prow">
            <div class="avatar">${initial}</div>
            <div>
              <b style="font:500 1.5rem var(--serif);color:var(--ivory);">${escapeHtml(name)}</b>
              <p class="sub">Valued Member of Kalyan Covering</p>
            </div>
          </div>

          <form id="profForm" onsubmit="handleSaveProfile(event)">
            <div class="fgrid2">
              <label class="f">Full Name
                <input type="text" id="p-name" value="${escapeHtml(name)}" required />
                <span class="err" id="err-pname"></span>
              </label>

              <label class="f">Mobile Number
                <input type="tel" id="p-phone" inputmode="numeric" maxlength="10" value="${escapeHtml(user.phone || user.phoneNumber || '')}" />
                <span class="err" id="err-pphone"></span>
              </label>

              <label class="f">Email Address
                <input type="email" id="p-email" value="${escapeHtml(user.email || '')}" disabled style="opacity:0.7;" />
                <small style="color:var(--muted);font-size:0.75rem;">Email linked to your login account</small>
              </label>

              <label class="f">Date of Birth (Optional)
                <input type="date" id="p-dob" value="${escapeHtml(user.dob || '')}" />
              </label>
            </div>

            <div class="oact" style="margin-top:1.5rem;">
              <button class="btn solid" type="submit" id="save-profile-btn">Save Changes</button>
            </div>
          </form>
        </div>
      `;
    }

    async function renderAddressesTab(container, user, addresses) {
      if (editAddressId) {
        const isNew = editAddressId === 'new';
        const addr = isNew ? {} : addresses.find(a => a.id === editAddressId) || {};

        container.innerHTML = `
          <h2 class="t">${isNew ? 'Add New Address' : 'Edit Address'}</h2>
          <div class="box">
            <form id="addrForm" onsubmit="handleSaveAddress(event)">
              <div class="fgrid2">
                <label class="f">Address Label
                  <select class="sel" id="ad-label">
                    <option ${addr.label === 'Home' ? 'selected' : ''}>Home</option>
                    <option ${addr.label === 'Work' ? 'selected' : ''}>Work</option>
                    <option ${addr.label === 'Other' ? 'selected' : ''}>Other</option>
                  </select>
                </label>

                <label class="f">Recipient Full Name *
                  <input type="text" id="ad-name" value="${escapeHtml(addr.name || user.name || '')}" required />
                </label>

                <label class="f">Mobile Number *
                  <input type="tel" id="ad-phone" inputmode="numeric" maxlength="10" value="${escapeHtml(addr.phone || user.phone || '')}" required />
                </label>

                <label class="f">Pincode *
                  <input type="text" id="ad-pin" inputmode="numeric" maxlength="6" value="${escapeHtml(addr.pin || '')}" required />
                </label>

                <label class="f full">Street Address *
                  <textarea id="ad-line" rows="2" required>${escapeHtml(addr.line || '')}</textarea>
                </label>

                <label class="f">City *
                  <input type="text" id="ad-city" value="${escapeHtml(addr.city || '')}" required />
                </label>

                <label class="f">State *
                  <input type="text" id="ad-state" value="${escapeHtml(addr.state || 'Tamil Nadu')}" required />
                </label>
              </div>

              <div class="oact" style="margin-top:1.5rem;">
                <button class="btn solid" type="submit">Save Address</button>
                <button class="btn ghost" type="button" onclick="cancelAddressEdit()">Cancel</button>
              </div>
            </form>
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;">
          <h2 class="t" style="margin:0;">Saved Addresses</h2>
          <button class="btn solid sm" onclick="openNewAddressForm()">${ic('plus', 16)} Add New Address</button>
        </div>

        ${addresses.length ? `
          <div class="agrid">
            ${addresses.map(addr => `
              <div class="acard">
                <b>${escapeHtml(addr.label || 'Home')}</b>
                <p style="color:var(--ivory);font-weight:500;">${escapeHtml(addr.name || '')} • ${escapeHtml(addr.phone || '')}</p>
                <p>${escapeHtml(addr.line || '')}, ${escapeHtml(addr.city || '')}, ${escapeHtml(addr.state || '')} ${escapeHtml(addr.pin || '')}</p>
                <div class="oact" style="margin-top:0.8rem;">
                  <button class="btn sm ghost" onclick="openEditAddress('${addr.id}')">${ic('edit', 14)} Edit</button>
                  <button class="btn sm ghost" onclick="handleDeleteAddress('${addr.id}')" style="color:var(--danger);">${ic('trash', 14)} Remove</button>
                </div>
              </div>
            `).join('')}
          </div>
        ` : `
          <div class="empty box">
            <h2>No Saved Addresses</h2>
            <p>Save delivery addresses to speed up checkout on your future orders.</p>
            <button class="btn solid" onclick="openNewAddressForm()">Add Your First Address</button>
          </div>
        `}
      `;
    }

    window.openNewAddressForm = function() {
      editAddressId = 'new';
      const user = auth.currentUser || JSON.parse(localStorage.getItem('kc_user') || 'null');
      renderAccountTab(user);
    };

    window.openEditAddress = function(id) {
      editAddressId = id;
      const user = auth.currentUser || JSON.parse(localStorage.getItem('kc_user') || 'null');
      renderAccountTab(user);
    };

    window.cancelAddressEdit = function() {
      editAddressId = null;
      const user = auth.currentUser || JSON.parse(localStorage.getItem('kc_user') || 'null');
      renderAccountTab(user);
    };

    window.handleSaveProfile = async function(e) {
      e.preventDefault();
      const name = document.getElementById('p-name').value.trim();
      const phone = document.getElementById('p-phone').value.trim();
      const dob = document.getElementById('p-dob').value;

      const btn = document.getElementById('save-profile-btn');
      if (btn) btn.disabled = true;

      try {
        await updateProfile({ name, phone, dob });
      } finally {
        if (btn) btn.disabled = false;
      }
    };

    window.handleSaveAddress = async function(e) {
      e.preventDefault();
      const addressData = {
        label: document.getElementById('ad-label').value,
        name: document.getElementById('ad-name').value.trim(),
        phone: document.getElementById('ad-phone').value.trim(),
        line: document.getElementById('ad-line').value.trim(),
        city: document.getElementById('ad-city').value.trim(),
        state: document.getElementById('ad-state').value.trim(),
        pin: document.getElementById('ad-pin').value.trim()
      };

      if (editAddressId === 'new') {
        await addAddress(addressData);
      } else {
        await updateAddress(editAddressId, addressData);
      }

      editAddressId = null;
      const user = auth.currentUser || JSON.parse(localStorage.getItem('kc_user') || 'null');
      renderAccountTab(user);
    };

    window.handleDeleteAddress = async function(id) {
      if (!confirm('Are you sure you want to remove this saved address?')) return;
      await deleteAddress(id);
      const user = auth.currentUser || JSON.parse(localStorage.getItem('kc_user') || 'null');
      renderAccountTab(user);
    };

    document.addEventListener('DOMContentLoaded', initAccountPage);
  </script>
</body>

</html>
