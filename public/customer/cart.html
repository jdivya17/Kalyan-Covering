<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Bag | Kalyan Covering</title>
  <meta name="description" content="Review your shopping bag items at Kalyan Covering. Fast checkout with secure payments.">
  <link rel="icon" type="image/png" href="../assets/kalyan_logo.png">

  <!-- Fonts & Stylesheets -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/mobile.css">
</head>

<body>
  <!-- Global Shell Header Container -->
  <div id="global-header"></div>

  <!-- Main Content -->
  <main id="main-content">
    <div class="pagehead">
      <div class="wrap">
        <nav class="crumbs" aria-label="Breadcrumb">
          <a href="index.html">Home</a>
          <svg class="ic" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 6l6 6-6 6"/></svg>
          <b>Shopping Bag</b>
        </nav>
        <h1>Your Shopping Bag</h1>
        <p>Review items in your bag before proceeding to secure checkout.</p>
      </div>
    </div>

    <div class="wrap">
      <div class="co" id="cart-page-layout">
        <!-- Rendered by JavaScript -->
      </div>
    </div>
  </main>

  <!-- Global Shell Footer Container -->
  <div id="global-footer"></div>

  <!-- Scripts -->
  <script type="module" src="../js/app.js"></script>
  <script type="module" src="../js/utils/shellInit.js"></script>
  <script type="module">
    import { Cart } from '../js/services/cartService.js';
    import { formatCurrency, escapeHtml } from '../js/utils/helpers.js';
    import { ic } from '../js/utils/icons.js';

    let appliedCoupon = '';

    function renderCartPage() {
      const container = document.getElementById('cart-page-layout');
      if (!container) return;

      const items = Cart.load() || KC.cart || [];
      const subtotal = Cart.subtotal();
      const freeShippingLimit = 999;
      const leftForFree = Math.max(0, freeShippingLimit - subtotal);
      const delivery = subtotal > freeShippingLimit ? 0 : 99;
      let couponDiscount = 0;

      if (appliedCoupon === 'KALYAN10') {
        couponDiscount = Math.round(subtotal * 0.1);
      }

      const total = subtotal - couponDiscount + delivery;

      if (!items.length) {
        container.innerHTML = `
          <div style="grid-column:1/-1;text-align:center;padding:4rem 1rem;" class="empty">
            <h2>Your Bag is Empty</h2>
            <p style="color:var(--muted);margin:0.8rem 0 1.6rem;">Explore our beautiful gold-covering jewellery and add something special.</p>
            <a href="products.html" class="btn solid">Browse Collection</a>
          </div>`;
        return;
      }

      container.innerHTML = `
        <!-- Left: Cart Items & Free Delivery Bar -->
        <div>
          <!-- Free Shipping Progress -->
          <div class="box" style="margin-bottom:1.5rem;">
            <div style="font-size:0.92rem;color:var(--muted);">
              ${leftForFree > 0
                ? `Add <b style="color:var(--gold-hi)">${formatCurrency(leftForFree)}</b> more for <b style="color:var(--ok)">FREE Delivery</b>`
                : `<b style="color:var(--ok)">🎉 You've unlocked FREE Delivery across India!</b>`}
            </div>
            <div style="height:4px;background:var(--line2);margin-top:8px;border-radius:2px;overflow:hidden;">
              <div style="height:100%;background:var(--foil);width:${Math.min(100, (subtotal / freeShippingLimit) * 100)}%;transition:width 0.4s ease;"></div>
            </div>
          </div>

          <!-- Items List -->
          <div class="box">
            <h2>Items in Bag (${items.reduce((s, i) => s + (i.qty || 1), 0)})</h2>
            ${items.map((item, idx) => `
              <div class="li" style="padding:1rem 0;">
                <img src="${item.image || item.primaryImageURL || item.images?.[0] || '/img-fallback.svg'}" alt="${escapeHtml(item.name)}" onerror="this.src='/img-fallback.svg'" />
                <div class="li-info">
                  <b>${escapeHtml(item.name)}</b>
                  <small style="color:var(--gold);font-weight:600;">${formatCurrency(item.price)} each</small>
                  <div style="display:flex;gap:10px;align-items:center;margin-top:0.6rem;flex-wrap:wrap;">
                    <div class="qty" style="height:34px;">
                      <button onclick="handleCartQtyChange('${item.id}', ${(item.qty || 1) - 1})" aria-label="Decrease quantity">${ic('minus', 14)}</button>
                      <output style="min-width:26px;">${item.qty || 1}</output>
                      <button onclick="handleCartQtyChange('${item.id}', ${(item.qty || 1) + 1})" aria-label="Increase quantity">${ic('plus', 14)}</button>
                    </div>
                    <button class="btn ghost sm" onclick="handleCartRemove('${item.id}')" style="color:var(--danger);border-color:transparent;padding:0.3rem 0.6rem;" aria-label="Remove item">Remove</button>
                  </div>
                </div>
                <div class="li-price">
                  ${formatCurrency(item.price * (item.qty || 1))}
                </div>
              </div>
            `).join('')}
          </div>
        </div>

        <!-- Right: Order Summary & Coupon -->
        <div class="sumcol">
          <div class="box">
            <h2>Order Summary</h2>
            
            <!-- Coupon Input -->
            <div class="cpn">
              <input type="text" id="coupon-input" placeholder="Coupon Code (e.g. KALYAN10)" value="${appliedCoupon}" />
              <button class="btn sm" onclick="handleApplyCoupon()">Apply</button>
            </div>
            ${appliedCoupon ? `<div style="color:var(--ok);font-size:0.85rem;margin-top:0.4rem;">✓ Coupon ${appliedCoupon} applied (10% OFF)</div>` : ''}

            <!-- Totals Breakdown -->
            <div class="tot">
              <div><span>Subtotal</span><span>${formatCurrency(subtotal)}</span></div>
              ${couponDiscount ? `<div><span>Discount</span><span style="color:var(--ok)">-${formatCurrency(couponDiscount)}</span></div>` : ''}
              <div><span>Delivery</span><span>${delivery === 0 ? '<b style="color:var(--ok)">FREE</b>' : formatCurrency(delivery)}</span></div>
              <div class="grand">
                <span>Estimated Total</span>
                <span>${formatCurrency(total)}</span>
              </div>
            </div>

            <a href="checkout.html" class="btn solid block" style="margin-top:1.5rem;padding:1rem;">Proceed to Checkout</a>
            <a href="products.html" class="btn ghost block" style="margin-top:0.6rem;">Continue Shopping</a>
          </div>
        </div>
      `;
    }

    window.handleCartQtyChange = function(id, qty) {
      Cart.updateQty(id, qty);
      renderCartPage();
    };

    window.handleCartRemove = function(id) {
      Cart.remove(id);
      renderCartPage();
    };

    window.handleApplyCoupon = function() {
      const input = document.getElementById('coupon-input');
      if (!input) return;
      const code = input.value.trim().toUpperCase();
      if (code === 'KALYAN10') {
        appliedCoupon = 'KALYAN10';
      } else {
        appliedCoupon = '';
        alert('Invalid coupon code. Try code "KALYAN10" for 10% off.');
      }
      renderCartPage();
    };

    document.addEventListener('DOMContentLoaded', renderCartPage);
  </script>
</body>

</html>
