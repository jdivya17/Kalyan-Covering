<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders & Tracking | Kalyan Covering</title>
  <meta name="description" content="Track your jewellery shipments, request returns, and view order history at Kalyan Covering.">
  <meta property="og:title" content="Orders &amp; Tracking | Kalyan Covering">
  <meta property="og:description" content="Track your jewellery shipments, request returns, and view order history at Kalyan Covering.">
  <meta property="og:image" content="../assets/kalyan_logo.png">
  <link rel="icon" type="image/png" href="../assets/kalyan_logo.png">

  <!-- Fonts & Stylesheets -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/mobile.css">
</head>

<body>
  <!-- Global Shell Header Container -->
  <div id="global-header"></div>

  <!-- Main Content -->
  <main id="main-content">
    <div class="pagehead">
      <div class="wrap">
        <h1>Orders & Tracking</h1>
        <p>Track live delivery status, manage cancellations, and request returns.</p>
      </div>
    </div>

    <div class="wrap">
      <div class="acc">
        <!-- Account Sidebar Navigation -->
        <nav class="accnav" aria-label="Account Menu">
          <a href="profile.html">
            <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
            <span>Profile</span>
          </a>
          <a href="#orders" class="acc-tab-btn active" data-tab="orders">
            <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg>
            <span>Orders & Tracking</span>
          </a>
          <a href="profile.html#addresses">
            <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 21s7-6 7-11a7 7 0 10-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
            <span>Saved Addresses</span>
          </a>
          <a href="wishlist.html">
            <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 20s-7-4.6-9-9.2C1.7 7.4 3.8 4 7.2 4c2 0 3.6 1.1 4.8 2.9C13.2 5.1 14.8 4 16.8 4 20.2 4 22.3 7.4 21 10.8 19 15.4 12 20 12 20z"/></svg>
            <span>Wishlist</span>
          </a>
          <a href="#returns" class="acc-tab-btn" data-tab="returns">
            <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 9h12a4 4 0 010 8H8"/><path d="M8 5L4 9l4 4"/></svg>
            <span>Returns & Refunds</span>
          </a>
          <button type="button" onclick="window.logoutUser()">
            <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></svg>
            <span>Log Out</span>
          </button>
        </nav>

        <!-- Main Orders & Tracking Content -->
        <div class="accmain" id="orders-main-content">
          <div class="order-skeleton-wrap" style="display:flex;flex-direction:column;gap:16px;">
            <div style="height:140px;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:20px;display:flex;flex-direction:column;gap:12px;opacity:0.6;animation:pulse 1.5s infinite;">
              <div style="height:20px;width:40%;background:rgba(214,178,94,0.15);border-radius:2px;"></div>
              <div style="height:14px;width:60%;background:rgba(255,255,255,0.05);border-radius:2px;"></div>
              <div style="height:36px;width:25%;background:rgba(214,178,94,0.1);border-radius:2px;margin-top:auto;"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  
  <!-- Reason Modal for Cancel / Return -->
  <div id="order-action-modal" class="auth-modal-overlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(6px);z-index:1000;display:none;align-items:center;justify-content:center;padding:1.5rem;" onclick="if(event.target===this)closeOrderModal()">
    <div style="background:var(--bg2, #0d0a06);border:1px solid var(--line);border-radius:8px;padding:2rem;width:100%;max-width:440px;box-shadow:0 20px 50px rgba(0,0,0,0.8);box-sizing:border-box;">
      <h3 id="modal-title" style="font-family:var(--serif);font-size:1.4rem;color:var(--gold-hi);margin-bottom:0.5rem;">Order Action</h3>
      <p id="modal-desc" style="font-size:0.85rem;color:var(--muted);margin-bottom:1rem;line-height:1.5;">Please share the reason:</p>
      <form id="order-modal-form" onsubmit="handleModalSubmit(event)">
        <textarea id="modal-reason-input" class="form-input" rows="3" placeholder="Enter reason here..." required style="width:100%;background:#060503;border:1px solid var(--line);border-radius:4px;padding:0.75rem;color:var(--ivory);font-size:16px;box-sizing:border-box;margin-bottom:1.2rem;resize:vertical;"></textarea>
        <div style="display:flex;gap:0.75rem;">
          <button type="submit" id="modal-confirm-btn" class="btn solid" style="flex:1;min-height:44px;">Submit</button>
          <button type="button" class="btn ghost" onclick="closeOrderModal()" style="min-height:44px;padding:0 1.2rem;">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Global Shell Footer Container -->
  <div id="global-footer"></div>

  <!-- Scripts -->
  <script type="module" src="../js/app.js"></script>
  <script type="module" src="../js/utils/shellInit.js"></script>
  <script type="module">
    import { auth } from '../js/firebase-config.js';
    import { STORE_CONFIG } from '../js/config/storeConfig.js';
    import { getMyOrders, cancelOrder, initiateReturn } from '../js/services/orderService.js';
    import { formatCurrency, escapeHtml, formatDate } from '../js/utils/helpers.js';
    import { ic } from '../js/utils/icons.js';
    import { generateInvoicePDF } from '../js/utils/invoiceGenerator.js';

    // Canonical step slugs + labels for the progress tracker
    const STEPS = [
      { slug: 'pending',           label: 'Order Placed' },
      { slug: 'packed',            label: 'Packed' },
      { slug: 'shipped',           label: 'Shipped' },
      { slug: 'out_for_delivery',  label: 'Out for Delivery' },
      { slug: 'delivered',         label: 'Delivered' }
    ];

    /** Map canonical slug to human-readable label */
    function statusLabel(slug) {
      const s = String(slug || '').toLowerCase();
      return {
        payment_pending:          'Payment Pending',
        pending:                  'Order Placed',
        confirmed:                'Confirmed',
        packed:                   'Packed',
        shipped:                  'Shipped',
        out_for_delivery:         'Out for Delivery',
        delivered:                'Delivered',
        cancelled:                'Cancelled',
        returned:                 'Returned',
        action_required_oversold: 'Under Review'
      }[s] || (s ? s.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase()) : s);
    }

    let orders = [];
    let currentTab = window.location.hash.replace('#', '') || 'orders';
    let trackOrderId = new URLSearchParams(window.location.search).get('id') || new URLSearchParams(window.location.search).get('orderId');

    async function initOrdersPage() {
      const user = auth.currentUser || JSON.parse(localStorage.getItem('kc_user') || 'null');
      if (!user) {
        window.location.href = 'auth.html';
        return;
      }

      orders = await getMyOrders();

      window.addEventListener('hashchange', () => {
        currentTab = window.location.hash.replace('#', '') || 'orders';
        renderView();
      });

      renderView();
    }

    function renderView() {
      document.querySelectorAll('.acc-tab-btn').forEach(btn => {
        const isCurrent = btn.dataset.tab === currentTab;
        btn.classList.toggle('active', isCurrent);
      });

      const container = document.getElementById('orders-main-content');
      if (!container) return;

      if (trackOrderId) {
        renderTrackingDetail(container, trackOrderId);
        return;
      }

      if (currentTab === 'returns') {
        renderReturnsTab(container);
      } else {
        renderOrdersList(container);
      }
    }

    function getStepIndex(status) {
      const s = String(status || '').toLowerCase();
      const map = {
        'payment_pending': 0,
        'pending':         0,
        'placed':          0,
        'confirmed':       0,
        'packed':          1,
        'shipped':         2,
        'out_for_delivery': 3,
        'delivered':       4
      };
      return map[s] !== undefined ? map[s] : -1;
    }

    function renderOrdersList(container) {
      if (!orders.length) {
        container.innerHTML = `
          <div class="empty box">
            <h2>No Orders Yet</h2>
            <p style="color:var(--muted);margin:0.8rem 0 1.5rem;">Explore our jewellery collections and make your first order.</p>
            <a href="products.html" class="btn solid">Browse Collection</a>
          </div>`;
        return;
      }

      container.innerHTML = `
        <h2 class="t">My Orders (${orders.length})</h2>
        ${orders.map(order => {
          const status = String(order.orderStatus || order.status || 'pending').toLowerCase();
          const stepIdx = getStepIndex(status);
          const isCancelled = status === 'cancelled';
          const isDelivered = status === 'delivered';
          const canCancel = !isCancelled && stepIdx >= 0 && stepIdx < 2;
          const orderDate = order.createdAt?.toDate ? order.createdAt.toDate() : (order.createdAt ? new Date(order.createdAt) : new Date());
          const isEligibleForReturn = isDelivered && (Date.now() - orderDate.getTime() < 7 * 24 * 60 * 60 * 1000);

          return `
            <div class="order">
              <div class="ohead">
                <div>
                  <b>${escapeHtml(order.id || order.orderId || 'KC-ORDER')}</b>
                  <span>Placed on ${formatDate(orderDate)}</span>
                </div>
                <div style="text-align:right;">
                  <span class="badge" style="background:rgba(214,178,94,0.15);color:var(--gold-hi);">${escapeHtml(statusLabel(status))}</span>
                  <div style="margin-top:4px;font-weight:600;color:var(--ivory);">${formatCurrency(order.amount || order.total || 0)}</div>
                </div>
              </div>

              <!-- Order Items List -->
              <div style="margin:1rem 0;">
                ${(order.items || []).map(item => `
                  <div class="li" style="padding:0.6rem 0;">
                    <img src="${item.image || '/img-fallback.svg'}" alt="${escapeHtml(item.name || 'Jewellery')}" />
                    <div class="li-info">
                      <b>${escapeHtml(item.name || 'Jewellery Item')}</b>
                      <small>Qty: ${item.qty || 1}</small>
                    </div>
                    <div class="li-price">${formatCurrency((item.price || 0) * (item.qty || 1))}</div>
                  </div>
                `).join('')}
              </div>

              <!-- 5-Step Status Progress Tracker -->
              ${!isCancelled ? `
                <div class="track">
                  ${STEPS.map((s, idx) => `
                    <div class="${idx <= stepIdx ? 'on' : ''}">${s.label}</div>
                  `).join('')}
                </div>
              ` : `
                <div style="color:var(--danger);padding:0.8rem 0;font-size:0.95rem;">Order Cancelled</div>
              `}

              <!-- Order Action Buttons -->
              <div class="oact">
                <button class="btn sm solid" onclick="openOrderTracking('${order.id || order.orderId}')">Track Order</button>
                <button class="btn sm ghost" onclick="handleDownloadInvoice('${order.id || order.orderId}')">
                  ${ic('doc', 15) || '📄'} Download Invoice (PDF)
                </button>
                ${canCancel ? `<button class="btn sm ghost" onclick="handleCancelOrder('${order.id || order.orderId}')" style="color:var(--danger);">Cancel Order</button>` : ''}
                ${isEligibleForReturn ? `<button class="btn sm ghost" onclick="handleReturnRequest('${order.id || order.orderId}')">Return / Exchange</button>` : ''}
                <a href="https://wa.me/${STORE_CONFIG?.contact?.whatsapp || "919876543210"}?text=${encodeURIComponent("Hi Kalyan Covering, I need help with order " + (order.id || order.orderId))}" target="_blank" rel="noopener" class="btn sm ghost">
                  ${ic('wa', 16)} WhatsApp Support
                </a>
              </div>
            </div>
          `;
        }).join('')}
      `;
    }

    function renderTrackingDetail(container, orderId) {
      const order = orders.find(o => (o.id === orderId || o.orderId === orderId));
      if (!order) {
        container.innerHTML = `<div class="empty"><h2>Order Not Found</h2><button class="btn solid" onclick="clearTrackOrder()">Back to Orders</button></div>`;
        return;
      }

      const status = String(order.orderStatus || order.status || 'pending').toLowerCase();
      const stepIdx = getStepIndex(status);
      const isCancelled = status === 'cancelled';
      const orderDate = order.createdAt?.toDate ? order.createdAt.toDate() : (order.createdAt ? new Date(order.createdAt) : new Date());

      const sd = order.shippingDetails || {};
      const awb = sd.awbCode || sd.trackingNumber || order.trackingId || null;
      const carrier = sd.courierName || sd.carrier || null;
      const trackUrl = sd.trackingUrl || (awb ? `https://shiprocket.co/tracking/${awb}` : null);

      container.innerHTML = `
        <div style="margin-bottom:1.2rem;">
          <button class="btn ghost sm" onclick="clearTrackOrder()">← Back to All Orders</button>
        </div>

        <div class="box">
          <div class="ohead">
            <div>
              <b>Track Order: ${escapeHtml(order.id || order.orderId)}</b>
              <span>Placed on ${formatDate(orderDate)}</span>
            </div>
            <span class="badge" style="background:rgba(214,178,94,0.15);color:var(--gold-hi);">${escapeHtml(statusLabel(status))}</span>
          </div>

          ${awb || carrier ? `
            <div style="margin: 1rem 0; padding: 0.8rem 1rem; background: rgba(255,255,255,0.03); border-radius: 8px; border: 1px solid var(--line);">
              <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
                <div>
                  ${carrier ? `<div><small style="color:var(--muted)">Courier Partner:</small> <b style="color:var(--ivory)">${escapeHtml(carrier)}</b></div>` : ''}
                  ${awb ? `<div><small style="color:var(--muted)">AWB / Tracking No:</small> <b style="color:var(--gold-hi)">${escapeHtml(awb)}</b></div>` : ''}
                </div>
                ${trackUrl ? `
                  <a href="${trackUrl}" target="_blank" rel="noopener" class="btn sm solid">
                    Track Package ↗
                  </a>
                ` : ''}
              </div>
            </div>
          ` : ''}

          <!-- Vertical Timeline -->
          ${!isCancelled ? `
            <ol class="tl">
              ${(() => {
                const history = Array.isArray(order.statusHistory) ? order.statusHistory : [];
                return STEPS.map((step, idx) => {
                  const isDone = idx <= stepIdx;
                  const isNow = idx === stepIdx;

                  // Find matching history entry
                  const historyEntry = history.find(h => String(h.status || '').toLowerCase() === step.slug) ||
                                       (idx === 0 && history.length ? history[0] : null);

                  let entryTimeStr = '';
                  if (historyEntry) {
                    const t = historyEntry.changedAt || historyEntry.timestamp;
                    const dateObj = t?.toDate ? t.toDate() : (t ? new Date(t) : null);
                    if (dateObj && !isNaN(dateObj.getTime())) {
                      entryTimeStr = formatDate(dateObj) + ' • ' + dateObj.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
                    }
                  } else if (idx === 0 && orderDate) {
                    entryTimeStr = formatDate(orderDate);
                  }

                  const noteText = historyEntry?.note || '';

                  return `
                    <li class="${isDone ? 'done' : ''} ${isNow ? 'now' : ''}">
                      <i>${isDone ? (ic('check', 14) || '✓') : ''}</i>
                      <div>
                        <b>${step.label}</b>
                        ${entryTimeStr ? `<small style="color:var(--gold-hi);display:block;margin-top:2px;font-size:0.78rem;">${escapeHtml(entryTimeStr)}</small>` : ''}
                        ${noteText ? `<p style="color:var(--muted);font-size:0.82rem;margin-top:2px;">${escapeHtml(noteText)}</p>` : ''}
                      </div>
                    </li>
                  `;
                }).join('');
              })()}
            </ol>
          ` : `
            <div style="color:var(--danger);padding:1rem 0;font-size:0.95rem;">This order has been cancelled.</div>
          `}
        </div>
      `;
    }

    function renderReturnsTab(container) {
      const returns = orders.filter(o => {
        const s = String(o.orderStatus || o.status || '').toLowerCase();
        return s === 'returned' || s === 'return_requested';
      });
      if (!returns.length) {
        container.innerHTML = `
          <div class="empty box">
            <h2>No Active Returns or Refunds</h2>
            <p style="color:var(--muted);margin:0.8rem 0 1.5rem;">Return or exchange requests are open within 7 days of delivery.</p>
            <a href="#orders" class="btn solid" onclick="window.location.hash='orders'">View Delivered Orders</a>
          </div>`;
        return;
      }

      container.innerHTML = `
        <h2 class="t">Returns & Refund Status</h2>
        ${returns.map(o => `
          <div class="order">
            <div class="ohead">
              <div>
                <b>Return for Order ${escapeHtml(o.id || o.orderId)}</b>
                <span>Status: ${escapeHtml(o.status)}</span>
              </div>
              <span class="badge" style="color:var(--gold-hi);">${o.status === 'returned' ? 'Refund Processed' : 'Under Review'}</span>
            </div>
            <p style="color:var(--muted);font-size:0.9rem;">
              Our customer care representative will inspect your request and schedule pickup / refund within 2-3 business days.
            </p>
          </div>
        `).join('')}
      `;
    }

    window.openOrderTracking = function(id) {
      trackOrderId = id;
      renderView();
    };

    window.clearTrackOrder = function() {
      trackOrderId = null;
      renderView();
    };

    let activeModalAction = null;
    let activeModalOrderId = null;

    window.closeOrderModal = function() {
      const modal = document.getElementById('order-action-modal');
      if (modal) modal.style.display = 'none';
      activeModalAction = null;
      activeModalOrderId = null;
    };

    window.handleModalSubmit = async function(e) {
      e.preventDefault();
      const reason = document.getElementById('modal-reason-input')?.value?.trim();
      if (!reason) return;

      const submitBtn = document.getElementById('modal-confirm-btn');
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.textContent = 'Processing...';
      }

      if (activeModalAction === 'cancel') {
        await cancelOrder(activeModalOrderId, reason);
      } else if (activeModalAction === 'return') {
        await initiateReturn(activeModalOrderId, reason);
      }

      closeOrderModal();
      if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit';
      }
      orders = await getMyOrders();
      renderView();
    };

    window.handleCancelOrder = function(id) {
      activeModalAction = 'cancel';
      activeModalOrderId = id;
      document.getElementById('modal-title').textContent = 'Cancel Order';
      document.getElementById('modal-desc').textContent = 'Please tell us the reason for cancelling this order:';
      document.getElementById('modal-reason-input').value = '';
      const modal = document.getElementById('order-action-modal');
      if (modal) modal.style.display = 'flex';
    };

    window.handleReturnRequest = function(id) {
      activeModalAction = 'return';
      activeModalOrderId = id;
      document.getElementById('modal-title').textContent = 'Return / Exchange Request';
      document.getElementById('modal-desc').textContent = 'Please tell us why you would like to return or exchange this item:';
      document.getElementById('modal-reason-input').value = '';
      const modal = document.getElementById('order-action-modal');
      if (modal) modal.style.display = 'flex';
    };

    document.addEventListener('DOMContentLoaded', initOrdersPage);
  </script>
</body>

</html>
