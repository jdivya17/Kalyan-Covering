<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Jewellery Catalog | Kalyan Covering Erode</title>
  <meta name="description" content="Browse Kalyan Covering's full collection of necklaces, rings, bangles, and earrings with live category, price, and stone filters.">
  <link rel="icon" type="image/png" href="../assets/kalyan_logo.png">

  <!-- Fonts & Stylesheets -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="../css/theme.css">
</head>

<body>
  <!-- Global Shell Header -->
  <div id="global-header"></div>

  <!-- Main Content -->
  <main id="main-content">
    <!-- Page Header & Breadcrumbs -->
    <div class="pagehead">
      <div class="wrap">
        <nav class="crumbs" aria-label="Breadcrumb">
          <a href="index.html">Home</a>
          <svg class="ic" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 6l6 6-6 6"/></svg>
          <b>All Jewellery</b>
        </nav>
        <h1 id="catalog-title">All Jewellery Catalog</h1>
        <p>Gold-covering jewellery handcrafted with rich micro-gold finish in Erode.</p>
      </div>
    </div>

    <div class="wrap">
      <!-- Shop Controls Bar -->
      <div class="shop-top">
        <div class="l">
          <button class="btn sm fbtn" onclick="openFilterPanel()">
            <svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
            Filters
          </button>
          <span class="count" id="catalog-count">0 pieces</span>
        </div>
        <div>
          <select class="sel" id="sortSelect" onchange="handleSortChange(this.value)">
            <option value="featured">Sort: Featured</option>
            <option value="low">Price: Low to High</option>
            <option value="high">Price: High to Low</option>
            <option value="discount">Biggest Discount</option>
          </select>
        </div>
      </div>

      <!-- Active Filters Bar -->
      <div class="active-filters" id="active-chips-container" style="display:none;"></div>

      <!-- Shop Main Body (Filter Sidebar + Product Results Grid) -->
      <div class="shop-body">
        <aside class="fpanel" id="fpanel"></aside>
        <div class="results">
          <div class="grid" id="catalog-grid"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- Global Shell Footer -->
  <div id="global-footer"></div>

  <!-- Scripts -->
  <script type="module" src="../js/app.js"></script>
  <script type="module" src="../js/utils/shellInit.js"></script>
  <script type="module">
    import { initProductsPage } from '../js/pages/productsPage.js';
    document.addEventListener('DOMContentLoaded', () => {
      initProductsPage();
    });
  </script>
</body>

</html>
